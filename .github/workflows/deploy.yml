name: Test

# CI runs typecheck and tests on every push and pull request.
# Deployment is handled by Cloudflare Workers Builds, which is connected to this
# repository and deploys every push to `main`. There is deliberately no deploy
# job here, so the Worker is never deployed twice and no Cloudflare token lives
# in GitHub.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
