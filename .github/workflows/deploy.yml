name: Test

# CI runs typecheck and tests on every push and pull request.
# Deployment is handled by Cloudflare Workers Builds, which is connected to this
# repository and deploys every push to `main`. There is deliberately no deploy
# job here, so the Worker is never deployed twice and no Cloudflare token lives
# in GitHub.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what
      # runs here. The comment records the release each SHA belongs to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Fails the build on a high or critical advisory in anything the Worker
      # ships. Dev-only tooling (wrangler, vitest) is not deployed, so it is
      # left out of this gate; run a plain `npm audit` locally to review it.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
